name: Prodly — Trigger Async Validation

# Posts a commit status (pending) to block PR merge.
# Uses the Statuses API (not Checks API) so a plain PAT can update it.
# Prints the curl command to set it to success/failure.
#
# In production: pipelines-service posts to
#   POST /repos/{owner}/{repo}/statuses/{sha}
# using a GitHub App installation token or a PAT with repo scope.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, integration, qa, staging]

permissions:
  statuses: write
  pull-requests: read

jobs:
  trigger:
    name: "Post pending status + print update commands"
    runs-on: ubuntu-latest
    steps:
      - name: Post commit status (pending) — PR merge is now blocked
        id: status
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const repo = context.repo;

            await github.rest.repos.createCommitStatus({
              owner: repo.owner,
              repo: repo.repo,
              sha: sha,
              state: 'pending',
              context: 'prodly/validation',
              description: 'Salesforce validation in progress...',
              target_url: 'https://github.com/' + repo.owner + '/' + repo.repo + '/actions'
            });

            console.log(`⏳ Status posted: pending`);
            console.log(`   sha  : ${sha}`);
            console.log(`   context: prodly/validation`);

            core.setOutput('sha', sha);
            core.setOutput('repo', `${repo.owner}/${repo.repo}`);

      - name: Print commands to update the status (you run these)
        env:
          SHA: ${{ steps.status.outputs.sha }}
          REPO: ${{ steps.status.outputs.repo }}
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════════════════════"
          echo "  STATUS POSTED: pending — PR merge is blocked"
          echo "  sha     : ${SHA}"
          echo "  context : prodly/validation"
          echo "  repo    : ${REPO}"
          echo "══════════════════════════════════════════════════════════════════════"
          echo ""
          echo "  YOU are pipelines-service. Run one of these when validation completes:"
          echo ""
          echo "  ─── Mark SUCCESS (unblocks PR merge) ────────────────────────"
          echo ""
          echo "  curl -s -X POST \\"
          echo "    -H \"Authorization: Bearer \$GH_TOKEN\" \\"
          echo "    -H \"Accept: application/vnd.github+json\" \\"
          echo "    https://api.github.com/repos/${REPO}/statuses/${SHA} \\"
          echo "    -d '{\"state\":\"success\",\"context\":\"prodly/validation\",\"description\":\"Validation passed. PR is unblocked.\"}'"
          echo ""
          echo "  ─── Mark FAILURE (keeps PR blocked) ────────────────────────"
          echo ""
          echo "  curl -s -X POST \\"
          echo "    -H \"Authorization: Bearer \$GH_TOKEN\" \\"
          echo "    -H \"Accept: application/vnd.github+json\" \\"
          echo "    https://api.github.com/repos/${REPO}/statuses/${SHA} \\"
          echo "    -d '{\"state\":\"failure\",\"context\":\"prodly/validation\",\"description\":\"Validation failed. Fix and push to re-trigger.\"}'"
          echo ""
          echo "══════════════════════════════════════════════════════════════════════"
          echo "  CI job done. Waiting for pipelines-service to call back."
          echo "══════════════════════════════════════════════════════════════════════"
